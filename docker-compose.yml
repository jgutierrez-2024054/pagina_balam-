version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: balam_postgres
    restart: always
    environment:
      POSTGRES_USER: balam_user
      POSTGRES_PASSWORD: balam_password
      POSTGRES_DB: balam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - balam_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: balam_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@balam.gt
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - balam_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  balam_network:
    driver: bridge
